name: Validate Worldline
on: [push, pull_request, workflow_dispatch]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,atrium]'
      - run: python -m pytest -q
      - run: npm --prefix web ci
      - run: npm --prefix web run build
  wan-adapter-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/wan_adapter/requirements-real.txt
      - run: python test_cpu.py --output results/ci-cpu-tests.json
        working-directory: experiments/wan_adapter
      - run: python test_independent.py
        working-directory: experiments/wan_adapter
      - run: python test_training_protocol.py
        working-directory: experiments/wan_adapter
      - run: python native_control/test_parity.py --output results/ci-native-parity.json
        working-directory: experiments/wan_adapter
      - run: python native_control/test_independent.py
        working-directory: experiments/wan_adapter
      - run: python native_control/test_clamp_independent.py
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_parity.py --output results/ci-tokenwise-parity.json
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_independent.py --output results/ci-tokenwise-independent.json
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_training.py --output results/ci-tokenwise-training.json
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_training_independent.py --output results/ci-tokenwise-training-independent.json
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_pilot.py --output results/ci-tokenwise-pilot.json
        working-directory: experiments/wan_adapter
      - run: python tokenwise_time/test_pilot_independent.py --output results/ci-tokenwise-pilot-independent.json
        working-directory: experiments/wan_adapter
  wan22-native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/wan_adapter/requirements-real.txt -r experiments/wan22_native/requirements-core.txt -r experiments/wan22_native/requirements-sample.txt
      - run: python -m pytest -q experiments/wan22_native/test_core.py experiments/wan22_native/test_independent.py experiments/wan22_native/test_profile_independent.py experiments/wan22_native/test_codec.py experiments/wan22_native/test_codec_decode.py experiments/wan22_native/test_codec_independent.py experiments/wan22_native/test_codec_memory.py experiments/wan22_native/test_codec_memory_independent.py experiments/wan22_native/test_sample_clip.py experiments/wan22_native/test_sample_independent.py
      - run: python -m experiments.wan22_native.codec_cpu_diagnostic --output work/wan22-cpu-prefix-linux-diagnostic-v1.json
      - run: python -m experiments.wan22_native.codec_cpu_projection_diagnostic --output work/wan22-cpu-projection-linux-diagnostic-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-cpu-prefix-diagnostic
          path: |
            work/wan22-cpu-prefix-linux-diagnostic-v1.json
            work/wan22-cpu-projection-linux-diagnostic-v2.json
      # Keep the original cross-length exact test and measured sources intact.
      # The portable fixture below retains exact same-length causality checks.
      - run: python -m pytest -q experiments/wan22_native/action_adapter/test_cpu.py experiments/wan22_native/action_adapter/test_independent.py experiments/wan22_native/action_data/test_data.py experiments/wan22_native/action_data/test_codec_path.py experiments/wan22_native/action_data/test_independent.py -k 'not test_initial_encode_is_independent_and_future_perturbation_causal'
      - run: python -m experiments.wan22_native.test_codec_cpu_portable --output work/wan22-codec-cpu-portable-linux-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-codec-portable
          path: work/wan22-codec-cpu-portable-linux-v1.json
      - run: python -m pytest -q experiments/wan22_native/shift3/test_cpu.py experiments/wan22_native/shift3/test_independent.py
      - run: python -m pytest -q experiments/wan22_native/action_adapter/test_pooling.py experiments/wan22_native/tiny_decoder/test_cpu.py
      - run: python scripts/fetch_atrium_rgb.py --output ../../work/atrium-pilot/dense-pair
      - run: python -m pytest -q experiments/wan22_native/action_training/test_cpu.py experiments/wan22_native/action_training/test_independent.py
      - run: python -m pytest -q experiments/wan22_native/official_cpu/test_cpu.py experiments/wan22_native/official_cpu/test_independent.py
      - run: python -m pytest -q experiments/wan22_native/cuda_reference/test_cpu.py experiments/wan22_native/cuda_reference/test_independent.py
      - run: python -m experiments.wan22_native.spatial_reference.test_protocol --output work/wan22-spatial-cpu-review.json
      - run: >-
          python -m experiments.wan22_native.spatial_reference.run
          --mode codec --profile both --expected-gpu 'NVIDIA A100-SXM4-80GB'
          --weights /nonexistent-plan-only-weights
          --inputs experiments/wan22_native/spatial_reference/prepared-inputs-v1
          --input-manifest-sha256 765b0863f6b0ce8d9bb0e4edf4fdbcc64fa9e96b997eb5e61c010eb0c2f1ccdf
          --cpu-report work/wan22-spatial-cpu-review.json
          --output work/wan22-spatial-codec-plan
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-spatial-cpu-review
          path: |
            work/wan22-spatial-cpu-review.json
            work/wan22-spatial-codec-plan/metrics.json
      - run: python -m experiments.wan22_native.spatial_audit.test_suite --output work/wan22-spatial-audit-cpu-review.json
      - run: python experiments/wan22_native/spatial_reference/results/a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/test_cpu.py experiments/wan22_native/action_cuda/test_independent.py
      - run: python -m experiments.wan22_native.action_cuda.cache_review --output work/wan22-action-cuda-cache-cpu.json
      - run: python -m pytest -q experiments/wan22_native/action_cuda/test_probe.py experiments/wan22_native/action_cuda/test_probe_independent.py
      - run: python experiments/wan22_native/action_cuda/results/a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/results/a100-v1/test_fetch_artifacts.py
      - run: python experiments/wan22_native/action_cuda/results/fixed16-a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/results/fixed16-a100-v1/test_fetch_artifacts.py
      - run: python experiments/wan22_native/action_cuda/results/visual-a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/results/visual-a100-v1/test_fetch_artifacts.py
      - run: python experiments/wan22_native/action_cuda/results/diagnostic-a100-v1/verify_payload.py
      - run: python experiments/wan22_native/action_cuda/results/fixed128-a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/results/fixed128-a100-v1/test_fetch_artifacts.py
      - run: python experiments/wan22_native/action_cuda/results/post128-a100-v1/verify_payload.py
      - run: python -m pytest -q experiments/wan22_native/action_cuda/results/post128-a100-v1/test_fetch_artifacts.py
      - run: python -m pytest -q experiments/wan22_native/action_effect/training/test_effect.py experiments/wan22_native/action_effect/training/test_runner.py
      - name: Run action-effect assessment with the original fixture thread limit
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import pytest
          import torch
          torch.set_num_threads(1)
          assert torch.get_num_threads() == 1
          raise SystemExit(pytest.main([
              '-q',
              'experiments/wan22_native/action_effect/assessment/test_reader.py',
              'experiments/wan22_native/action_effect/assessment/test_assessment.py',
              '-k', 'not actual_packet and not actual_original_input_reader_and_small_checkpoint_loads',
          ]))
          PY
      - run: python -m pytest -q experiments/wan22_native/action_effect/visual/test_run.py
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: python experiments/wan22_native/action_effect/results/verify_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-action-cuda-cache-cpu
          path: work/wan22-action-cuda-cache-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-spatial-audit-cpu-review
          path: work/wan22-spatial-audit-cpu-review.json
  text-cache-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/wan_adapter/text_cache/requirements-test.txt
      - run: python -m pytest -q experiments/wan_adapter/text_cache/test_cpu.py experiments/wan_adapter/text_cache/test_cache.py experiments/wan_adapter/text_cache/test_run_cache.py
