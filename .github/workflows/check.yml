name: Validate Worldline
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,atrium]'
      - run: python -m pytest -q
      - run: npm --prefix web ci
      - run: npm --prefix web run build
  wan-adapter-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/wan_adapter/requirements-real.txt
      - run: python test_cpu.py --output results/ci-cpu-tests.json
        working-directory: experiments/wan_adapter
      - run: python test_independent.py
        working-directory: experiments/wan_adapter
      - run: python test_training_protocol.py
        working-directory: experiments/wan_adapter
  text-cache-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/wan_adapter/text_cache/requirements-test.txt
      - run: python -m pytest -q experiments/wan_adapter/text_cache/test_cpu.py experiments/wan_adapter/text_cache/test_cache.py
